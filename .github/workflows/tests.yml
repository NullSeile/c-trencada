name: test ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install dependencies
      run: |
          sudo apt update
          sudo apt-get install -y libcurl4t64
          docker pull erikvl87/languagetool
          docker run -d --rm -p 8081:8010 erikvl87/languagetool
          sleep 2
    - name: make check
      run: |
          make test
